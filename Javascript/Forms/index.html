<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email & Password Validator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .form-container {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }

    .form-title {
      text-align: center;
      color: #333;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 2px solid #e1e5e9;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    /* Icons */
    .form-group.email::before {
      content: "📧";
      position: absolute;
      left: 1rem;
      top: 2.8rem;
      font-size: 1.2rem;
      z-index: 1;
    }

    .form-group.password::before {
      content: "🔒";
      position: absolute;
      left: 1rem;
      top: 2.8rem;
      font-size: 1.2rem;
      z-index: 1;
    }

    /* Validation States */
    .form-group.valid input {
      border-color: #10b981;
      background: #f0fdf4;
    }

    .form-group.invalid input {
      border-color: #ef4444;
      background: #fef2f2;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:active {
      transform: translateY(-1px);
    }

    .validation-msg {
      margin-top: 0.5rem;
      padding: 0.5rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
    }

    .valid-msg {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }

    #finalmsg{

            display: flex;
            justify-content: center;
    }

    @media (max-width: 480px) {
      .form-container {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1 class="form-title">Login</h1>
    
    <form >
      <div class="form-group email">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter your email"
           
        >
        <div class="validation-msg error-msg" id="emailMsg"></div>
      </div>

      <div class="form-group password">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password"
           
        >
        <div class="validation-msg error-msg" id="passwordMsg">aa</div>
      </div>

      <div id="finalmsg"></div>
      <br>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>
  </div>

  <script src="./script.js"></script>
</body>
</html>
