<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 2rem 1rem;
}

.profiles-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, 500px);
  gap: 2rem;
  max-width: 1400px;
  margin: 5px;
  padding: 2rem 0;
  justify-content: center;
}

.profile-card {
  width: 500px;
  height: 500px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}

.profile-card:hover {
  transform: translateY(-10px);
  box-shadow: 0 35px 70px -12px rgba(0, 0, 0, 0.3);
}

.profile-image {
  width: 100%;
  height: 280px;
  object-fit: cover;
}

.profile-content {
  flex: 1;
  padding: 2rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.profile-name {
  font-size: 1.75rem;
  font-weight: 800;
  color: #2d3748;
  margin-bottom: 0.75rem;
  letter-spacing: -0.025em;
}

.profile-bio {
  color: #718096;
  line-height: 1.7;
  font-size: 1rem;
  opacity: 0.9;
}

/* Responsive */
@media (max-width: 1100px) {
  .profiles-container {
    grid-template-columns: 500px;
  }
}

@media (max-width: 540px) {
  body {
    padding: 1rem 0.5rem;
  }
  
  .profile-card {
    width: 100%;
    max-width: 350px;
    height: 450px;
  }
  
  .profile-image {
    height: 220px;
  }
  
  .profile-content {
    padding: 1.5rem;
  }

}

  #h6{

      font-size: xx-large;
      display: flex;
      align-items: center;
      justify-content: center;
  }

  </style>
</head>
<body>

    <input type="text" placeholder="search" id="input">
    <br><br>
    <div id="profile-container"></div>
    <div>
      <h6 id="h6"></h6>
    </div>

    
   

    <script src="./script.js"></script>
</body>
</html>
