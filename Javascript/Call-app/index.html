<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Card + New Call Form UI</title>
<style>
  :root {
    --bg: #1f1f1f;
    --card: #2a2a2a;
    --card-border: #3a3a3a;
    --text-main: #ffffff;
    --text-muted: #d0d0d0;
    --field-bg: #3b3b3b;
    --field-border: #4b4b4b;
    --btn-black: #000000;
    --btn-red: #7b0000;
    --btn-radius: 999px;
    --radius-card: 24px;
    --radius-field: 999px;
    --shadow-soft: 0 24px 60px rgba(0, 0, 0, 0.65);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Inter", sans-serif;
  }

  body {
    min-height: 100vh;
    background: #181818;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-main);
  }

  /* ---------- base container ---------- */
  .app {
    position: relative;
    width: 900px;
    height: 520px;
    background: var(--bg);
    border-radius: 32px;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }

  /* ---------- CARD on the right ---------- */
  .card-wrapper {
    position: absolute;
    top: 50%;
    left: 55%;
    transform: translate(-50%, -50%);
  }

  .card {
    width: 380px;
    height: 240px;
    background: var(--card);
    border-radius: var(--radius-card);
    border: 1px solid var(--card-border);
    padding: 28px 30px;
    position: relative;
    color: var(--text-main);
  }

  .card::after,
  .card::before {
    /* stacked cards illusion */
    content: "";
    position: absolute;
    inset: 16px 10px auto;
    border-radius: var(--radius-card);
    border: 1px solid rgba(0, 0, 0, 0.55);
    transform: translateY(18px);
    opacity: 0.25;
  }
  .card::before {
    inset: 26px 18px auto;
    transform: translateY(36px);
    opacity: 0.1;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 20%, #3e7bff, #a0003f);
    overflow: hidden;
  }

  .card-title {
    font-size: 24px;
    font-weight: 700;
  }

  .card-content {
    font-size: 14px;
    color: var(--text-muted);
  }

  .row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .row span:first-child {
    min-width: 90px;
  }

  .card-actions {
    margin-top: 22px;
    display: flex;
    gap: 12px;
  }

  .pill-btn {
    padding: 8px 20px;
    border-radius: var(--btn-radius);
    border: none;
    outline: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .pill-btn.call {
    background: #000;
    color: #fff;
  }

  .pill-btn.msg {
    background: transparent;
    color: #fff;
    border: 1px solid #4b4b4b;
  }

  /* ---------- side buttons left ---------- */
  .side-buttons {
    position: absolute;
    left: 80px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .circle-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid #3b3b3b;
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
  }

  /* ---------- color dots right ---------- */
  .color-dots {
    position: absolute;
    right: 130px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
  }

  .dot.black { background: #000; }
  .dot.purple { background: #4c1d95; }
  .dot.brown { background: #6b2e0a; }
  .dot.cyan  { background: #00a7a2; }

  /* ---------- OVERLAY FORM (initially hidden) ---------- */
  .overlay-form {
  position: absolute;
  /* display: none; */
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;              /* make sure this is flex when visible */
  align-items: center;        /* vertically center */
  justify-content: center;    /* horizontally center */
  z-index: 10;
}

.form-card {
  width: 520px;
  display: none;
  /* remove any margin-left/right you might have added */
}

  .form-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .field-group {
    margin-bottom: 18px;
  }

  .field-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: block;
  }

  .text-input {
    width: 100%;
    padding: 10px 18px;
    border-radius: var(--radius-field);
    border: 1px solid var(--field-border);
    background: var(--field-bg);
    color: var(--text-main);
    font-size: 14px;
    outline: none;
  }

  .text-input:focus {
    border-color: #4a80ff;
    box-shadow: 0 0 0 1px #4a80ff;
  }

  .radio-group {
    margin-top: 6px;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .radio-option input[type="radio"] {
    accent-color: #ffffff;
  }

  .btn-row {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-primary {
    width: 100%;
    padding: 12px 0;
    border-radius: var(--btn-radius);
    border: none;
    background: var(--btn-black);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-secondary {
    width: 100%;
    padding: 12px 0;
    border-radius: var(--btn-radius);
    border: none;
    background: var(--btn-red);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">
  <!-- left buttons -->
  <div class="side-buttons">
    <button class="circle-btn">+</button>
    <button class="circle-btn">↑</button>
    <button class="circle-btn">↓</button>
  </div>

  <!-- right color dots -->
  <div class="color-dots">
    <div class="dot black"></div>
    <div class="dot purple"></div>
    <div class="dot brown"></div>
    <div class="dot cyan"></div>
  </div>

  <!-- main card -->
  <div class="card-wrapper">
    <div class="card">
      <div class="card-header">
        <div class="avatar"></div>
        <div class="card-title">Lorine</div>
      </div>
      <div class="card-content">
        <div class="row">
          <span>Home town</span>
          <span>Bhopal</span>
        </div>
        <div class="row">
          <span>Purpose</span>
          <span>Application for College</span>
        </div>
        <div class="card-actions">
          <button class="pill-btn call">Call</button>
          <button class="pill-btn msg">Message</button>
        </div>
      </div>
    </div>
  </div>

  <!-- OVERLAY FORM (toggle visibility by changing display) -->
  <div class="overlay-form">
    <div class="form-card">
      <div class="form-title">New Call</div>

      <div class="field-group">
        <label class="field-label">Image URL</label>
        <input class="text-input" type="text"
               value="https://i.pinimg.com/736x/73/1c/06/731c069641a25bdd9a419a05" />
      </div>

      <div class="field-group">
        <label class="field-label">Full Name</label>
        <input class="text-input" type="text" value="George" />
      </div>

      <div class="field-group">
        <label class="field-label">Home Town</label>
        <input class="text-input" type="text" value="Auckland" />
      </div>

      <div class="field-group">
        <label class="field-label">Purpose</label>
        <input class="text-input" type="text" value="Quick Ed" />
      </div>

      <div class="field-group">
        <span class="field-label">Category</span>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="category" checked />
            <span>Emergency</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="category" />
            <span>Important</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="category" />
            <span>Urgent</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="category" />
            <span>No Rush</span>
          </label>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary">Create Note</button>
        <button class="btn-secondary">Close</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
